<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Verify email — ModuleMint</title>
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<main class="container-narrow auth-page">
<a class="wordmark auth-brand" href="/" aria-label="ModuleMint home"><img class="brand-mark" src="brand/logo-mark-dark.png" alt="" width="22" height="22">Module<span class="brand-mint">Mint</span></a>

<h1>Verify your email</h1>
<p class="page-lead" id="pageLead">Confirming your email address&hellip;</p>

<section class="panel auth-panel">
<div id="formNotice" class="notice ok" role="status" hidden></div>
<div id="formError" class="notice error" role="alert" hidden></div>
<a id="dashboardLink" href="dashboard.html" class="button auth-submit" hidden>Go to Dashboard</a>
<button type="button" id="resendBtn" class="button auth-submit" hidden>Resend verification email</button>
<p id="resendMessage" class="password-hint" role="status" hidden></p>
</section>

<p class="auth-footer-note"><a href="dashboard.html">&larr; Back to dashboard</a></p>
<p class="auth-back-link"><a href="/">&larr; Back to homepage</a></p>
</main>
<script src="api.js"></script>
<script src="confirm-email.js"></script>
</body>
</html>
