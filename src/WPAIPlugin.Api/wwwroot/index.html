<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WPAI Plugin Builder</title>
<link rel="stylesheet" href="auth.css" />
</head>
<body>
<main>
  <h1>WPAIPlugin</h1>

  <section class="card" id="loggedOut" hidden>
    <p class="sub">AI-assisted WordPress plugin building.</p>
    <div class="actions">
      <a href="login.html"><button type="button">Log in</button></a>
      <a href="register.html"><button type="button" class="secondary">Create account</button></a>
    </div>
  </section>

  <section class="card" id="loggedIn" hidden>
    <p class="sub">You're signed in.</p>
    <div class="actions">
      <a href="dashboard.html"><button type="button">Go to dashboard</button></a>
    </div>
  </section>
</main>
<script>
(async () => {
  try {
    const response = await fetch("/api/account/me");
    if (response.ok) {
      document.getElementById("loggedIn").hidden = false;
    } else {
      document.getElementById("loggedOut").hidden = false;
    }
  } catch (err) {
    document.getElementById("loggedOut").hidden = false;
  }
})();
</script>
</body>
</html>
