<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Reset password — ModuleMint</title>
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<main class="container-narrow auth-page">
<a class="wordmark auth-brand" href="/" aria-label="ModuleMint home"><img class="brand-mark" src="brand/logo-mark-dark.png" alt="" width="22" height="22">Module<span class="brand-mint">Mint</span></a>

<h1>Choose a new password</h1>
<p class="page-lead">Enter a new password for your account.</p>

<section class="panel auth-panel">
<form id="resetPasswordForm" novalidate>
  <div class="field">
    <label for="newPassword">New password</label>
    <input type="password" id="newPassword" autocomplete="new-password" required />
    <p class="password-hint">At least 6 characters, with an uppercase letter, a lowercase letter, a number and a symbol.</p>
  </div>
  <div class="field">
    <label for="confirmPassword">Confirm password</label>
    <input type="password" id="confirmPassword" autocomplete="new-password" required />
  </div>

  <button type="submit" id="submitBtn" class="button auth-submit">Reset password</button>
  <p id="submitLoading" class="auth-loading" hidden><span class="spinner" aria-hidden="true"></span> Resetting&hellip;</p>
</form>

<div id="formNotice" class="notice ok" role="status" hidden></div>
<div id="formError" class="notice error" role="alert" hidden></div>
</section>

<p class="auth-footer-note"><a href="login.html">&larr; Back to log in</a></p>
<p class="auth-back-link"><a href="/">&larr; Back to homepage</a></p>
</main>
<script src="api.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
