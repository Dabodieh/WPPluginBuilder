<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Create account — ModuleMint</title>
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<main class="container-narrow auth-page">
<a class="wordmark auth-brand" href="/" aria-label="ModuleMint home"><img class="brand-mark" src="brand/logo-mark-dark.png" alt="" width="22" height="22">Module<span class="brand-mint">Mint</span></a>

<h1>Create your account</h1>
<p class="page-lead">Start planning and building WordPress plugins with AI.</p>

<section class="panel auth-panel">
<form id="registerForm" novalidate>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" required />
    <p class="password-hint">At least 6 characters, with an uppercase letter, a lowercase letter, a number and a symbol.</p>
  </div>
  <div class="field">
    <label for="confirmPassword">Confirm password</label>
    <input type="password" id="confirmPassword" autocomplete="new-password" required />
  </div>

  <div id="turnstileContainer"></div>

  <button type="submit" id="registerBtn" class="button auth-submit">Create account</button>
  <p id="registerLoading" class="auth-loading" hidden><span class="spinner" aria-hidden="true"></span> Creating account&hellip;</p>
</form>

<div id="registerError" class="notice error" role="alert" hidden></div>
</section>

<p class="auth-footer-note">Already have an account? <a href="login.html">Log in</a></p>
<p class="auth-back-link"><a href="/">&larr; Back to homepage</a></p>
</main>
<script src="api.js"></script>
<script src="register.js"></script>
</body>
</html>
