<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create account - WPAI Plugin Builder</title>
<link rel="stylesheet" href="auth.css" />
</head>
<body>
<main>
  <h1>WPAI Plugin Builder</h1>
  <p class="sub">Create an account.</p>

  <section class="card">
    <form id="registerForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password" required />

      <div class="actions">
        <button type="submit" id="registerBtn">Create account</button>
        <span id="registerLoading" hidden>Creating account&hellip;</span>
      </div>
    </form>

    <div id="registerError" class="notice error" hidden></div>

    <p class="sub" style="margin-top:16px">
      Already have an account? <a class="link" href="login.html">Log in</a>.
    </p>
  </section>
</main>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorNode = document.getElementById("registerError");
  errorNode.hidden = true;

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  document.getElementById("registerBtn").disabled = true;
  document.getElementById("registerLoading").hidden = false;

  try {
    const response = await fetch("/api/account/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });

    if (!response.ok) {
      const body = await response.json().catch(() => null);
      const message = body && Array.isArray(body.errors) && body.errors.length > 0
        ? body.errors.join(" ")
        : (body && body.error) || "Could not create account.";
      errorNode.textContent = message;
      errorNode.hidden = false;
      return;
    }

    window.location.href = "dashboard.html";
  } catch (err) {
    errorNode.textContent = "Could not reach the server. Please try again.";
    errorNode.hidden = false;
  } finally {
    document.getElementById("registerBtn").disabled = false;
    document.getElementById("registerLoading").hidden = true;
  }
});
</script>
</body>
</html>
