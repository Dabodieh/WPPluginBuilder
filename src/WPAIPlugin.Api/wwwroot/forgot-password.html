<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Forgot password — ModuleMint</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<main class="container-narrow auth-page">
<a class="wordmark auth-brand" href="/" aria-label="ModuleMint home"><span class="brand-mark" aria-hidden="true">M</span>ModuleMint</a>

<h1>Reset your password</h1>
<p class="page-lead">Enter the email address on your account and we'll send you a link to reset your password.</p>

<section class="panel auth-panel">
<form id="forgotPasswordForm" novalidate>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required />
  </div>

  <button type="submit" id="submitBtn" class="button auth-submit">Send reset link</button>
  <p id="submitLoading" class="auth-loading" hidden><span class="spinner" aria-hidden="true"></span> Sending&hellip;</p>
</form>

<div id="formNotice" class="notice ok" role="status" hidden></div>
<div id="formError" class="notice error" role="alert" hidden></div>
</section>

<p class="auth-footer-note"><a href="login.html">&larr; Back to log in</a></p>
<p class="auth-back-link"><a href="/">&larr; Back to homepage</a></p>
</main>
<script src="api.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
