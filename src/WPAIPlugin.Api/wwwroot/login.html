<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Log in — ModuleMint</title>
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<main class="container-narrow auth-page">
<a class="wordmark auth-brand" href="/" aria-label="ModuleMint home"><img class="brand-mark" src="brand/logo-mark-dark.png" alt="" width="22" height="22">Module<span class="brand-mint">Mint</span></a>

<h1>Welcome back</h1>
<p class="page-lead">Log in to continue building and managing your WordPress plugins.</p>

<section class="panel auth-panel">
<form id="loginForm" novalidate>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <p class="password-hint"><a href="forgot-password.html">Forgot password?</a></p>
  </div>

  <button type="submit" id="loginBtn" class="button auth-submit">Log in</button>
  <p id="loginLoading" class="auth-loading" hidden><span class="spinner" aria-hidden="true"></span> Logging in&hellip;</p>
</form>

<div id="loginError" class="notice error" role="alert" hidden></div>
</section>

<p class="auth-footer-note">Don't have an account? <a href="register.html">Create account</a></p>
<p class="auth-back-link"><a href="/">&larr; Back to homepage</a></p>
</main>
<script src="api.js"></script>
<script src="login.js"></script>
</body>
</html>
