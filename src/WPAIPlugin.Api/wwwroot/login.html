<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in - WPAI Plugin Builder</title>
<link rel="stylesheet" href="auth.css" />
</head>
<body>
<main>
  <h1>WPAI Plugin Builder</h1>
  <p class="sub">Log in to your account.</p>

  <section class="card">
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />

      <div class="actions">
        <button type="submit" id="loginBtn">Log in</button>
        <span id="loginLoading" hidden>Logging in&hellip;</span>
      </div>
    </form>

    <div id="loginError" class="notice error" hidden></div>

    <p class="sub" style="margin-top:16px">
      No account yet? <a class="link" href="register.html">Create one</a>.
    </p>
  </section>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorNode = document.getElementById("loginError");
  errorNode.hidden = true;

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  document.getElementById("loginBtn").disabled = true;
  document.getElementById("loginLoading").hidden = false;

  try {
    const response = await fetch("/api/account/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });

    if (!response.ok) {
      const body = await response.json().catch(() => null);
      errorNode.textContent = (body && body.error) || "Invalid email or password.";
      errorNode.hidden = false;
      return;
    }

    window.location.href = "dashboard.html";
  } catch (err) {
    errorNode.textContent = "Could not reach the server. Please try again.";
    errorNode.hidden = false;
  } finally {
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginLoading").hidden = true;
  }
});
</script>
</body>
</html>
